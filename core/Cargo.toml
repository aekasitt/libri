[package]
authors = [
  'Sitt Guruvanich <aekazitt+github@gmail.com>',
]
description = 'Speed reading extension that streams text word-by-word at customizable paces powered by Rust & Leptos'
edition = '2024'
license = 'MIT'
name = 'libri'
publish = false
repository = 'https://github.com/aekasitt/libri'
version = { workspace = true }



[dependencies]
chrome-wasm-bindgen = '0.0.1'
icons = { version = '0.18.0', features = [ 'leptos' ] }
js-sys = '0.3.64'
leptos = { version = '0.5.0', features = [ 'csr' ] }
leptos_ui = '0.3.20'
serde = { version = '1.0.188', features = [ 'derive' ] }
serde_json = '1.0.107'
serde-wasm-bindgen = '0.6'
tw_merge = { features = ['variant'], version = '0.1.17' }
wasm-bindgen = '0.2.87'
web-sys = { version = '0.3', features = [
  'Document',
  'Element',
  'HtmlElement',
  'KeyboardEvent',
  'MessageEvent',
  'MouseEvent',
  'ShadowRoot',
  'ShadowRootMode',
  'Window',
] }


[features]
development = []


[package.metadata.leptos]
tailwind-input-file = '../extension/style.css'
